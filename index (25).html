<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Box Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" class="back-btn">⬅ Back</a>
    
    <div class="bento-container">
        
        <!-- Big Greeting Box -->
        <div class="bento-box box-1">
            <h2 id="greeting">Hello! 👋</h2>
            <p>Welcome to my personal workspace.</p>
        </div>
        
        <!-- Social Link 1 -->
        <a href="" target="_blank" class="bento-box box-2 link-box github">
            <h3>GitHub</h3>
            <p>View Projects</p>
        </a>
        
        <!-- Profile Pic Box -->
        <div class="bento-box box-3 profile">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar">
        </div>
        
        <!-- Social Link 2 -->
        <a href="https://linkedin.com" target="_blank" class="bento-box box-4 link-box linkedin">
            <h3>LinkedIn</h3>
            <p>Let's Connect</p>
        </a>
        
        <!-- Wide Skills Box -->
        <div class="bento-box box-5">
            <h3>Tech Stack</h3>
            <div class="tags">
                <span>HTML5</span>
                <span>CSS3</span>
                <span>JavaScript</span>
                <span>React</span>
                <span>Node.js</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
