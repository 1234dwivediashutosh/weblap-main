<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" class="back-btn">⬅ Back to Web Lab</a>
    
    <div class="card">
        <h2>QR Generator</h2>
        <p>Paste a URL or enter text to create a QR</p>
        
        <input type="text" id="qr-text" placeholder="e.g., https://github.com" autocomplete="off">
        <button onclick="generateQR()">Generate QR Code</button>
        
        <div id="img-box">
            <img src="" id="qr-img" alt="QR Code">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
