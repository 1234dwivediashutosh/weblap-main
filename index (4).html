<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" class="back-btn">⬅ Back to Web Lab</a>
    
    <div class="app-container">
        <header>
            <h2>Task Manager</h2>
        </header>
        
        <div class="input-section">
            <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off">
            <button onclick="addTask()" id="add-btn">Add</button>
        </div>

        <ul id="task-list">
            <!-- Tasks yahan JS ke through add honge -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
