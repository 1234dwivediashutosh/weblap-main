<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" class="back-btn">⬅ Back</a>
    
    <div class="scene">
        <div class="card" id="flip-card">
            
            <!-- Front Side: Search Box -->
            <div class="card-face card-front">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub Logo" class="logo">
                <h2>GitHub Finder</h2>
                <input type="text" id="search-input" placeholder="Enter GitHub username..." autocomplete="off">
                <button onclick="searchUser()">Search</button>
                <p id="error-msg" class="error"></p>
            </div>

            <!-- Back Side: Profile Data -->
            <div class="card-face card-back">
                <div class="profile-header">
                    <img src="" id="avatar" alt="Profile Pic">
                    <div class="names">
                        <h2 id="name">Name</h2>
                        <a href="#" id="github-link" target="_blank">@username</a>
                    </div>
                </div>
                
                <p id="bio">Bio goes here...</p>
                
                <div class="stats">
                    <div class="stat-box">
                        <span id="repos">0</span>
                        <p>Repos</p>
                    </div>
                    <div class="stat-box">
                        <span id="followers">0</span>
                        <p>Followers</p>
                    </div>
                    <div class="stat-box">
                        <span id="following">0</span>
                        <p>Following</p>
                    </div>
                </div>
                
                <button class="reset-btn" onclick="resetCard()">Search Another</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
