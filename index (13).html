<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" class="back-btn">⬅ Back</a>
    
    <div class="container">
        <h2>Expense Tracker</h2>
        
        <div class="balance-box">
            <h4>Your Balance</h4>
            <h1 id="balance">$0.00</h1>
        </div>

        <div class="inc-exp-container">
            <div>
                <h4>Income</h4>
                <p id="money-plus" class="money plus">+$0.00</p>
            </div>
            <div>
                <h4>Expense</h4>
                <p id="money-minus" class="money minus">-$0.00</p>
            </div>
        </div>

        <h3>History</h3>
        <ul id="list" class="list">
            <!-- JS yaha transactions add karega -->
        </ul>

        <h3>Add new transaction</h3>
        <div class="form-control">
            <label for="text">Text (e.g. Salary, Rent)</label>
            <input type="text" id="text" placeholder="Enter text..." autocomplete="off" />
        </div>
        <div class="form-control">
            <label for="amount">Amount <br />(negative - expense, positive - income)</label>
            <input type="number" id="amount" placeholder="Enter amount..." />
        </div>
        <button class="btn" onclick="addTransaction()">Add transaction</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
